[package]
name = "oxidize-webpki"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Santiago Fernández Muñoz"]
license = "MIT"
description = "RustCrypto signature verification algorithms for WebPKI"
repository = "https://github.com/bzsanti/oxidize-webpki"
readme = "README.md"
keywords = ["webpki", "rustcrypto", "x509", "signatures"]
categories = ["cryptography"]
include = ["src/**", "tests/fixtures/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
der = "0.7"
ecdsa = "0.16"
rsa = "0.9"
p256 = "0.13"
p384 = "0.13"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
rustls-pki-types = "1.14"
sha2 = { version = "0.10", features = ["oid"] }

[dev-dependencies]
spki = "0.7"
