name: Publish to crates.io
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact Cargo.toml version to publish'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: crates-io-publication
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      CC: 'false'
      CXX: 'false'
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check requested version
        run: |
          python3 - <<'PYTHON'
          import os, tomllib
          from pathlib import Path
          package = tomllib.loads(Path('Cargo.toml').read_text())['package']
          assert package['name'] == 'oxidize-webpki'
          assert package['license'] == 'MIT'
          assert package['version'] == os.environ['RELEASE_VERSION'], 'Version mismatch'
          PYTHON
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
      - name: Publish verified crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          cargo publish --locked --package oxidize-webpki
